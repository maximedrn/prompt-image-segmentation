# Git hooks runner. Install once: `lefthook install`.
# Run manually: `lefthook run pre-commit`.

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.py"
      run: poetry run black --check {staged_files}
    pylint:
      glob: "{src,tests,scripts}/**/*.py"
      run: poetry run pylint src tests scripts
    mypy:
      glob: "src/**/*.py"
      run: poetry run mypy src
    # Only the fast suite: the slow tests load the models and belong in
    # CI, not in front of every commit.
    pytest:
      glob: "{src,tests}/**/*.py"
      run: poetry run pytest -m "not slow"
    cspell:
      glob: "*.{py,md,toml,yaml,yml}"
      run: cspell --no-progress --no-summary {staged_files}
