name: prompt-image-segmentation

# One service per accelerator, selected with `--profile`. Metal is absent
# on purpose: Docker Desktop for macOS exposes no GPU to containers, so
# Apple Silicon runs natively (see the README).
x-app-common: &app-common
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  depends_on:
    redis:
      condition: service_healthy
  environment:
    # Queued work lives in the sidecar below, reachable by service name.
    JOB_BACKEND: ${JOB_BACKEND:-redis}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    AUTH_MODE: ${AUTH_MODE:-basic}
    SEGMENTATION_USERNAME: ${SEGMENTATION_USERNAME:-}
    SEGMENTATION_PASSWORD: ${SEGMENTATION_PASSWORD:-}
  env_file:
    - path: .env
      required: false
  ports:
    - "${PORT:-7860}:7860"
  tmpfs:
    # Read-only root: everything the process writes has to land here.
    - /tmp:size=256m,mode=1777
  volumes:
    # Model weights, ~700 MB, kept across container recreations. The hub
    # cache handles download atomicity and digest checks itself.
    - hf-cache:/var/cache/huggingface
  healthcheck:
    # Readiness, not liveness: answers 200 only once both models are
    # resident, which keeps traffic away during a cold download.
    test:
      - CMD
      - curl
      - --fail
      - --silent
      - --show-error
      - http://127.0.0.1:7860/readyz
    interval: 15s
    timeout: 5s
    retries: 3
    # Has to cover a cold weight download; start_interval keeps the probe
    # frequent so the service flips healthy as soon as it is ready.
    start_period: ${MODEL_DOWNLOAD_GRACE:-15m}
    start_interval: 5s

services:
  app-cpu:
    <<: *app-common
    profiles: ["cpu"]
    image: ghcr.io/maximedrn/prompt-image-segmentation:cpu
    build:
      context: .
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
        # Installs the extra as well: enabling the UI at runtime needs
        # the package to have been there at build time.
        ENABLE_UI: ${ENABLE_UI:-false}

  app-cuda:
    <<: *app-common
    profiles: ["cuda"]
    image: ghcr.io/maximedrn/prompt-image-segmentation:cuda
    build:
      context: .
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
        # Installs the extra as well: enabling the UI at runtime needs
        # the package to have been there at build time.
        ENABLE_UI: ${ENABLE_UI:-false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app-rocm:
    <<: *app-common
    profiles: ["rocm"]
    image: ghcr.io/maximedrn/prompt-image-segmentation:rocm
    build:
      context: .
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/rocm7.1
        # Installs the extra as well: enabling the UI at runtime needs
        # the package to have been there at build time.
        ENABLE_UI: ${ENABLE_UI:-false}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-109}

  # One queue for whichever profile is up: the API accepts jobs here
  # and the worker inside the app claims them. No profile of its own, so
  # `--profile cpu up` brings it along.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Payloads and results are reconstructible: a caller can resubmit.
    # Persistence would only buy a restart's worth of queued work, at
    # the cost of a writable volume on a read-only container.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  hf-cache: {}
