[tool.poetry]
name = "app"
version = "0.1.0"
description = "Prompt-driven image segmentation with SAM + GroundingDINO."
authors = ["Maxime Dréan <me@maximedrn.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "app", from = "src" }]

[tool.poetry.dependencies]
# 3.14.1 is excluded by torchvision 0.28, so the floor is 3.14.2 rather
# than a plain `~3.14`.
python = ">=3.14.2,<3.15"
fastapi = "^0.141.1"
uvicorn = { extras = ["standard"], version = "^0.52.3" }
python-multipart = "^0.0.32"
gradio = "^6.24"
jinja2 = "^3.1.6"
pydantic = "^2.13.4"
pydantic-settings = "^2.15"
pillow = "^12.3"
numpy = "^2.5.2"
opencv-python-headless = "^5.0.0"
requests = "^2.34.2"
huggingface-hub = "^1.27"
# Ships GroundingDINO and SAM 2.1 natively: no vendored fork, no compiled
# CUDA kernels, so ROCm / CPU / MPS all run the same code path.
transformers = "^5.15"
# Effect abstraction: Effect[Need[T], Error, Result] with explicit
# capabilities. Pure Python, so it compiles and installs anywhere.
stateless = "^0.6.1"
anyio = "^4.14.2"
# Default PyPI wheels cover: Apple Silicon (MPS), CPU everywhere else.
# NVIDIA CUDA or AMD ROCm users reinstall torch after `poetry install`
# from the matching index - see README. Poetry cannot host multiple
# source-specific variants of the same package in one lock file.
#
# torchvision is required even though nothing here imports it directly:
# transformers' Sam2ImageProcessor refuses to load without it.
torch = "^2.13.0"
torchvision = "^0.28.0"

[tool.poetry.group.person]
optional = true
[tool.poetry.group.person.dependencies]
facelib = { git = "https://github.com/maximedrn/facelib.git" }

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
mypy = "^2.3.1"
pylint = "^4.0.7"
# Second opinion on typing, per SKILL.md section 23.
pyright = "^1.1.411"
types-requests = "^2.33.0"
poethepoet = "^0.48.0"
pyclean = "^3.1.0"
pip-audit = "^2.10"
pytest = "^9.1"
# Required by starlette's TestClient.
httpx = "^0.28"
# Compiles the application package to native extension modules.
nuitka = "^4.1.3"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
format = "black src tests scripts"
lint = ["_pylint", "_mypy"]
_pylint = "pylint src"
_mypy = "mypy src"
test = "pytest"
outdated = "poetry show --outdated --top-level"
audit = "pip-audit --skip-editable"
clean = "pyclean . --debris"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "slow: loads the real models and runs inference",
]

[tool.black]
line-length = 79
target-version = ["py314"]
preview = true
enable-unstable-feature = [
    "hug_parens_with_braces_and_square_brackets",
    "string_processing",
    "wrap_long_dict_values_in_parens",
]

[tool.mypy]
python_version = "3.14"
mypy_path = ["src/typings"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
strict_optional = true
extra_checks = true
show_error_codes = true
show_column_numbers = true
pretty = true

# All previously-untyped modules now have local stubs under ``src/typings``
# (groundingdino, segment_anything, facelib) or ship types natively 
# (cv2, PIL, torch, numpy, huggingface_hub). No override needed - mypy 
# resolves everything through ``mypy_path``.

# Pydantic's generated methods expose ``Any`` internally, tripping
# ``disallow_any_explicit`` on every BaseModel/BaseSettings subclass.
# Relax that one code where we actually declare Pydantic models.
[[tool.mypy.overrides]]
module = [
    "app.interfaces.http.schemas",
    "app.settings",
    "app.domain.*",
]
disable_error_code = ["explicit-any"]

[tool.pylint.main]
py-version = "3.14"
jobs = 0
recursive = true
source-roots = ["src"]
ignore-paths = []
load-plugins = [
    "pylint.extensions.bad_builtin",
    "pylint.extensions.broad_try_clause",
    "pylint.extensions.check_elif",
    "pylint.extensions.code_style",
    "pylint.extensions.comparison_placement",
    "pylint.extensions.confusing_elif",
    "pylint.extensions.consider_refactoring_into_while_condition",
    "pylint.extensions.consider_ternary_expression",
    "pylint.extensions.dict_init_mutate",
    "pylint.extensions.docparams",
    "pylint.extensions.docstyle",
    "pylint.extensions.dunder",
    "pylint.extensions.empty_comment",
    "pylint.extensions.eq_without_hash",
    "pylint.extensions.for_any_all",
    "pylint.extensions.magic_value",
    "pylint.extensions.mccabe",
    "pylint.extensions.no_self_use",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.private_import",
    "pylint.extensions.redefined_loop_name",
    "pylint.extensions.redefined_variable_type",
    "pylint.extensions.set_membership",
    "pylint.extensions.typing",
    "pylint.extensions.while_used",
]
fail-under = 10.0
fail-on = ["E", "F"]

[tool.pylint."messages control"]
enable = ["all"]
disable = []
[tool.pylint.format]
max-line-length = 79
expected-line-ending-format = "LF"
single-line-if-stmt = false
single-line-class-stmt = false

[tool.pylint.basic]
good-names = ["i", "j", "k", "x", "y", "T", "_"]
docstring-min-length = 1
no-docstring-rgx = "^_"

[tool.pylint.design]
max-args = 8
max-attributes = 12
max-bool-expr = 5
max-branches = 12
max-locals = 20
max-parents = 7
max-public-methods = 25
max-returns = 8
max-statements = 60
min-public-methods = 0

[tool.pylint.imports]
allow-wildcard-with-all = false

[tool.pylint.refactoring]
max-nested-blocks = 4
never-returning-functions = [
    "sys.exit",
    "argparse.parse_error",
]

[tool.pylint.reports]
output-format = "colorized"
score = true

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
min-similarity-lines = 8

[tool.pylint.typecheck]
ignored-modules = [
    "cv2",
    "facelib",
    "stone",
]
# Gradio attaches ``click``/``change``/... on components dynamically
# via an EventListener metaclass; astroid can't see them.
generated-members = ["gradio.*"]

[tool.pylint.variables]
allow-global-unused-variables = false
init-import = false

[tool.pylint."deprecated builtins"]
bad-functions = ["map", "filter"]

# Second opinion alongside mypy (SKILL.md section 23). Strict
# everywhere, with one scoped relaxation: `transformers` is only
# partially typed, so every call into it yields `Unknown`. Rather than
# scatter ignores, the concession is confined to the adapter package -
# which is precisely the layer whose job is to face an untyped library.
# Domain, application and interfaces stay fully strict.
[tool.pyright]
include = ["src"]
extraPaths = ["src", "src/typings"]
stubPath = "src/typings"
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[[tool.pyright.executionEnvironments]]
root = "src/app/infrastructure"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingParameterType = false

[[tool.pyright.executionEnvironments]]
root = "src"
