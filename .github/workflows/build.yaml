name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_NO_INTERACTION: "1"
  POETRY_KEYRING_ENABLED: "false"

jobs:
  verify:
    name: Checkers and fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          pipx install poetry
          poetry install
      - name: Format
        run: poetry run black --check src tests scripts
      - name: Types
        run: |
          poetry run mypy src
          poetry run pyright
      - name: Lint
        run: poetry run pylint src
      - name: Spelling
        run: npx --yes cspell --no-progress "src/**/*.py" "tests/**/*.py" "*.md"
      # The slow suite loads several hundred megabytes of weights; it runs
      # in `models`, which caches them.
      - name: Fast tests
        run: poetry run pytest -m "not slow"
      - name: Audit
        run: poetry run pip-audit --skip-editable

  models:
    name: Model regression
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/app/infrastructure/constants.py') }}
      - name: Install
        run: |
          pipx install poetry
          poetry install
      # This is the gate the refactor is measured against: the masks must
      # still match the reference pipeline within the IoU floor, and
      # concurrent callers must not receive each other's results.
      - name: Slow tests
        run: poetry run pytest -m slow

  compile:
    name: Compile (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          pipx install poetry
          poetry install
      # `--module` compiles our package to a native extension and leaves
      # torch as an installed wheel. Nuitka cannot cross-compile, hence
      # one runner per architecture.
      - name: Compile the application package
        working-directory: src
        run: |
          poetry run python -m nuitka \
            --module app \
            --include-package=app \
            --output-dir=../build/nuitka \
            --no-progressbar \
            --assume-yes-for-downloads
      - name: Import the compiled module
        env:
          AUTH_MODE: none
        run: |
          cd build/nuitka
          poetry run python -c "
          import app
          from app.interfaces.http import create_app
          assert create_app() is not None
          print('compiled module imports and builds the transport')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ strategy.job-index }}
          path: build/nuitka/app.*.so

  # Feasibility spike, deliberately allowed to fail: Nuitka's standalone
  # mode has a long history of breaking on torch + transformers, whose
  # PyTorch detection is metadata-based. If this ever goes green the
  # `compile` job above can be replaced by it; until then `--module`
  # is what ships, and both satisfy "no .py of ours in the image".
  standalone-spike:
    name: Standalone spike (may fail)
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          pipx install poetry
          poetry install
      - name: Build a standalone binary
        run: |
          poetry run python -m nuitka \
            --standalone \
            --enable-plugin=anti-bloat \
            --include-package=app \
            --include-package=transformers \
            --include-distribution-metadata=torch \
            --include-distribution-metadata=transformers \
            --output-dir=build/standalone \
            --no-progressbar \
            --assume-yes-for-downloads \
            --lto=no \
            src/app/interfaces/http/application.py
      - name: Report the outcome
        run: du -sh build/standalone || true
