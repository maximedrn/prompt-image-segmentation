name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_NO_INTERACTION: "1"
  POETRY_KEYRING_ENABLED: "false"

jobs:
  verify:
    name: Checkers and fast tests
    runs-on: ubuntu-latest
    # The store tests skip themselves without a server, which would let
    # the adapter rot silently. This is what keeps them running.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          pipx install poetry
          poetry install --extras ui

      - name: Format
        run: poetry run black --check src tests

      - name: Types
        run: |
          poetry run mypy src
          poetry run pyright

      - name: Lint
        run: poetry run pylint src tests
      - name: Spelling
        run: npx --yes cspell --no-progress "src/**/*.py" "tests/**/*.py" "*.md"

      # The slow suite loads several hundred megabytes of weights; it runs
      # in `models`, which caches them.
      - name: Fast tests
        run: poetry run pytest -m "not slow"

      - name: Audit
        run: poetry run pip-audit --skip-editable

  models:
    name: Model regression
    runs-on: ubuntu-latest
    needs: verify
    steps:
      # The examples are LFS-tracked, and this is the only job that reads
      # them: without the smudge, Pillow gets a pointer file.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/app/infrastructure/inference/constants.py') }}

      - name: Install
        run: |
          pipx install poetry
          poetry install

      - name: Slow tests
        run: poetry run pytest -m slow

  image:
    name: Image (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: cpu
            index: https://download.pytorch.org/whl/cpu
          - profile: cuda
            index: https://download.pytorch.org/whl/cu130
          - profile: rocm
            index: https://download.pytorch.org/whl/rocm7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: matrix.profile != 'cpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runtime stage builds the transport as its last step, so a
      # broken image fails here instead of being published.
      - name: Build, verify and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: TORCH_INDEX_URL=${{ matrix.index }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.profile }}
            ghcr.io/${{ github.repository }}:${{ matrix.profile }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.profile }}
          cache-to: type=gha,mode=min,scope=${{ matrix.profile }}

  compile:
    name: Compile (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          pipx install poetry
          poetry install

      - name: Compile the application package
        working-directory: src
        run: |
          poetry run python -m nuitka \
            --module app \
            --include-package=app \
            --include-package=stateless \
            --output-dir=../build/nuitka \
            --no-progressbar \
            --assume-yes-for-downloads

      # The fast suite against the .so rather than the sources: this is
      # what catches a compiler that changes behaviour instead of
      # failing, which `--include-package=stateless` above exists for.
      - name: Test the compiled module
        env:
          PYTHONPATH: ${{ github.workspace }}/build/nuitka:${{ github.workspace }}
          AUTH_MODE: none
        run: poetry run pytest -m "not slow" -o pythonpath= -q
